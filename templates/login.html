{% extends "base.html" %}{% block content %}<div class="auth card"><p class="eyebrow">{{ 'CREATE ACCOUNT' if register else 'WELCOME BACK' }}</p><h1>{{ 'Create your Py2APK account' if register else 'Sign in to Py2APK' }}</h1><form id="authForm"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required minlength="10" autocomplete="{{ 'new-password' if register else 'current-password' }}"></label><button class="button" type="submit">{{ 'Register' if register else 'Sign in' }}</button><p id="authMsg" class="muted"></p></form><p>{% if register %}<a href="/login">Already have an account?</a>{% else %}<a href="/register">Create an account</a>{% end %}</p></div>{% end %}{% block scripts %}<script>window.setupAuth({{ 'true' if register else 'false' }});</script>{% end %}
